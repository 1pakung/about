<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1Pakung | About</title>
  <style>
    body {
      margin: 0;
      font-family: 'JetBrains Mono', monospace;
      background: #0a0a0a;
      color: #e6f1ff;
      text-align: center;
      line-height: 1.6;
    }

    header {
      padding: 80px 20px 40px;
      background: linear-gradient(135deg, #0a0a0a 70%, #002b55);
    }

    header h1 {
      font-size: 3rem;
      color: #00bfff;
      text-shadow: 0 0 12px #00bfff;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      color: #bbb;
    }

    section {
      margin: 50px auto;
      max-width: 900px;
      padding: 20px;
    }

    h2 {
      font-size: 2rem;
      color: #00bfff;
      margin-bottom: 25px;
      text-shadow: 0 0 8px #00bfff;
    }

    p { margin-bottom: 20px; color: #ddd; }

    /* Skills */
    .skills {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 25px;
    }

    .skill {
      background: #111;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px #001f33;
      transition: 0.3s;
    }

    .skill:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px #00bfff;
    }

    .skill h3 { color: #00bfff; margin-bottom: 10px; }
    .bar { background: #1a1a1a; border-radius: 8px; overflow: hidden; }
    .bar-fill { height: 12px; background: #00bfff; width: 0; animation: fill 2s forwards; border-radius: 8px; }

    @keyframes fill { from { width: 0; } }

    footer { background: #111; padding: 20px; color: #777; margin-top: 40px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Hello World 🌍</h1>
    <p></p>
  </header>

  <section>
    <h2>About</h2>
    <p>Programming is not just about syntax, but about solving problems. Mastering many languages means mastering many ways of thinking.</p>
  </section>

  <section>
    <h2>Languages & Skills</h2>
    <div class="skills">
      <div class="skill"><h3>Python</h3><div class="bar"><div class="bar-fill" style="width:65%"></div></div></div>
      <div class="skill"><h3>JavaScript</h3><div class="bar"><div class="bar-fill" style="width:55%"></div></div></div>
      <div class="skill"><h3>HTML</h3><div class="bar"><div class="bar-fill" style="width:40%"></div></div></div>
      <div class="skill"><h3>CSS</h3><div class="bar"><div class="bar-fill" style="width:30%"></div></div></div>
      <div class="skill"><h3>Java</h3><div class="bar"><div class="bar-fill" style="width:20%"></div></div></div>
      <div class="skill"><h3>C / C++</h3><div class="bar"><div class="bar-fill" style="width:20%"></div></div></div>
    </div>
  </section>

  <footer>
    © 2025 1Pakung | About
  </footer>
</body>
</html>
